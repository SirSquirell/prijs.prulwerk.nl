<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Prijswacht · je lijst</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{--page:#050505;--card:#101010;--card2:#191919;--line:#262626;--text:#F2F2F0;--text2:#9A9A96;--label:#8A8A85;--accent:#5B9DFF;--on-accent:#12120F;--warn:#FF8A6B}
body{margin:0;background:var(--page)}
a{color:var(--accent)}a:hover{color:var(--text)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--page); color: var(--text); font-family: 'Instrument Sans', sans-serif; font-size: 15px; line-height: 1.45">
  <div style="flex: 1; overflow: auto; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 30px; letter-spacing: -0.035em; line-height: 0.95">je lijst</span>
      <a href="Meldingen.dc.html" aria-label="account" style="width: 44px; height: 44px; border-radius: 22px; background: var(--card2); color: var(--text); display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600">M</a>
    </div>

    <div style="padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label)"><span>black friday · 27 nov</span><span style="color: var(--accent)">nog 50 dagen</span></div>
      <div style="height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden"><div style="width: 18%; height: 100%; background: var(--accent)"></div></div>
      <p style="margin: 0; color: var(--text2); font-size: 14px">we verzamelen nu prijzen. hoe langer de geschiedenis, hoe beter we straks een nep-korting herkennen.</p>
    </div>

    <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label)"><span>4 items · 18 winkels</span><span>laatste check 10:00</span></div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
        <a href="Item.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-decoration: none">
          <div style="display: flex; justify-content: space-between; gap: 12px; align-items: baseline">
            <span style="font-weight: 600">{{item.name}}</span>
            <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 22px; letter-spacing: -0.03em">{{item.price}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px">
            <span style="color: var(--text2)">{{item.shop}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; color: {{item.deltaColor}}">{{item.delta}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); background: var(--card); padding: 6px 8px 14px">
    <a href="Overzicht.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: var(--accent); text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>lijst</a>
    <a href="Toevoegen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: var(--text2); text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>toevoegen</a>
    <a href="Meldingen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: var(--text2); text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>meldingen</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const down = 'var(--accent)', flat = 'var(--text2)', up = 'var(--warn)';
    return {
      items: [
        { name: 'Sony WH-1000XM6', price: '€ 329', shop: 'laagst bij amazon.nl · 5 winkels', delta: '▼ € 20 deze week', deltaColor: down },
        { name: 'Nintendo Switch 2', price: '€ 469', shop: 'laagst bij bol · 6 winkels', delta: '= gelijk', deltaColor: flat },
        { name: 'Philips Airfryer XXL', price: '€ 189', shop: 'laagst bij mediamarkt · 3 winkels', delta: '▲ € 10', deltaColor: up },
        { name: 'Dyson V15 Detect', price: '€ 549', shop: 'doelprijs € 499 · 4 winkels', delta: '€ 50 te gaan', deltaColor: flat }
      ]
    };
  }
}
</script>
</body>
</html>
