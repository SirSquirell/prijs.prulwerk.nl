<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Prijswacht · item toevoegen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{--page:#050505;--card:#101010;--card2:#191919;--line:#262626;--text:#F2F2F0;--text2:#9A9A96;--label:#8A8A85;--accent:#5B9DFF;--on-accent:#12120F;--warn:#FF8A6B}
body{margin:0;background:var(--page)}
a{color:var(--accent)}a:hover{color:var(--text)}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--page); color: var(--text); font-family: 'Instrument Sans', sans-serif; font-size: 15px; line-height: 1.45">
  <div style="flex: 1; overflow: auto; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <a href="Overzicht.dc.html" style="align-self: flex-start; color: var(--text2); text-decoration: none; font-size: 14px; padding: 10px 0">← je lijst</a>
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-size: 34px; line-height: 0.94; letter-spacing: -0.035em">wat wil je volgen?</h1>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="q" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label)">productnaam of link</label>
      <input id="q" type="text" value="sony wh-1000xm6 zwart" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px">
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--card2); font-size: 14px; color: var(--text2)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--accent)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span>5 winkels gevonden die naar nederland leveren. 4 hebben dezelfde ean, die staan aan. bij twijfel staat hij uit.</span>
    </div>

    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label); padding: 0; margin-bottom: 8px">welke wil je volgen</legend>
      <sc-for list="{{offers}}" as="o" hint-placeholder-count="5">
        <label style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); cursor: pointer">
          <input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}">
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-weight: 600">{{o.shop}}</span>
            <span style="font-size: 12px; font-family: 'JetBrains Mono', monospace; color: {{o.noteColor}}">{{o.note}}</span>
          </span>
          <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 18px; letter-spacing: -0.03em">{{o.price}}</span>
        </label>
      </sc-for>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="doel" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label)">doelprijs (mag leeg)</label>
      <input id="doel" type="text" inputmode="decimal" placeholder="€ 299" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px">
    </div>
  </div>
  <div style="padding: 12px 20px 24px; border-top: 1px solid var(--line); background: var(--page)">
    <a href="Item.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; font-size: 16px">volg {{count}} winkels</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { coolblue: true, bol: true, amazon: true, mediamarkt: true, megekko: false } }; }
  renderVals() {
    const base = [
      { id: 'amazon', shop: 'amazon.nl', price: '€ 329', note: 'ean klopt', ok: true },
      { id: 'bol', shop: 'bol', price: '€ 339', note: 'ean klopt', ok: true },
      { id: 'coolblue', shop: 'coolblue', price: '€ 349', note: 'ean klopt', ok: true },
      { id: 'mediamarkt', shop: 'mediamarkt', price: '€ 349', note: 'ean klopt', ok: true },
      { id: 'megekko', shop: 'megekko', price: '€ 319', note: 'andere kleur, niet zeker', ok: false }
    ];
    const on = this.state.on;
    return {
      count: Object.values(on).filter(Boolean).length,
      offers: base.map((o) => ({
        ...o,
        on: on[o.id],
        noteColor: o.ok ? 'var(--text2)' : 'var(--warn)',
        toggle: () => this.setState({ on: { ...on, [o.id]: !on[o.id] } })
      }))
    };
  }
}
</script>
</body>
</html>
