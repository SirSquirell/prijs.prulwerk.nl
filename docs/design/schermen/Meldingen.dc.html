<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Prijswacht · account en meldingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{--page:#050505;--card:#101010;--card2:#191919;--line:#262626;--text:#F2F2F0;--text2:#9A9A96;--label:#8A8A85;--accent:#5B9DFF;--on-accent:#12120F;--warn:#FF8A6B}
body{margin:0;background:var(--page)}
a{color:var(--accent)}a:hover{color:var(--text)}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--page); color: var(--text); font-family: 'Instrument Sans', sans-serif; font-size: 15px; line-height: 1.45">
  <div style="flex: 1; overflow: auto; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-size: 30px; line-height: 0.95; letter-spacing: -0.035em">account en meldingen</h1>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 12px; color: var(--label)">kanalen</h2>
      <div style="border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line)">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">telegram</span><span style="font-size: 13px; color: var(--text2)">gekoppeld, berichten komen via de bot</span></span>
          <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font: inherit; font-size: 14px; cursor: pointer">ontkoppel</button>
        </div>
        <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">pushmelding</span><span style="font-size: 13px; color: var(--text2)">op iphone alleen als de site op je beginscherm staat</span></span><input type="checkbox"></label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">e-mail</span><span style="font-size: 13px; color: var(--text2)">één samenvatting per dag</span></span><input type="checkbox"></label>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 12px; color: var(--label)">wanneer</h2>
      <div style="border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column">
        <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer"><span style="flex: 1">elke daling</span><input type="checkbox" checked="{{ true }}"></label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer"><span style="flex: 1">onder mijn doelprijs</span><input type="checkbox" checked="{{ true }}"></label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer"><span style="flex: 1">black friday-oordeel</span><input type="checkbox" checked="{{ true }}"></label>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px"><span style="flex: 1">stille uren</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text2)">23:00 – 08:00</span></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 12px; color: var(--label)">inloggen</h2>
      <div style="border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">e-mail</span><span style="font-size: 13px; color: var(--text2)">[jouw e-mailadres]</span></span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">passkey</span><span style="font-size: 13px; color: var(--text2)">nog niet ingesteld</span></span><button type="button" style="height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">toevoegen</button></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line)"><span style="flex: 1; display: flex; flex-direction: column"><span>iphone · safari</span><span style="font-size: 13px; color: var(--text2)">dit apparaat · nog 29 dagen</span></span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px"><span style="flex: 1; display: flex; flex-direction: column"><span>macbook · chrome</span><span style="font-size: 13px; color: var(--text2)">laatst gezien gisteren</span></span><button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font: inherit; font-size: 14px; cursor: pointer">uitloggen</button></div>
      </div>
      <a href="Main.dc.html" style="align-self: flex-start; padding: 10px 0; color: var(--warn); text-decoration: none">overal uitloggen</a>
    </section>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); background: var(--card); padding: 6px 8px 14px">
    <a href="Overzicht.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: var(--text2); text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>lijst</a>
    <a href="Toevoegen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: var(--text2); text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>toevoegen</a>
    <a href="Meldingen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: var(--accent); text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>meldingen</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
