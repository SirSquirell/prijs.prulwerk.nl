<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Prijswacht · item detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{--page:#050505;--card:#101010;--card2:#191919;--line:#262626;--text:#F2F2F0;--text2:#9A9A96;--label:#8A8A85;--accent:#5B9DFF;--on-accent:#12120F;--warn:#FF8A6B}
body{margin:0;background:var(--page)}
a{color:var(--accent)}a:hover{color:var(--text)}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: auto; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px; background: var(--page); color: var(--text); font-family: 'Instrument Sans', sans-serif; font-size: 15px; line-height: 1.45">
  <a href="Overzicht.dc.html" style="align-self: flex-start; color: var(--text2); text-decoration: none; font-size: 14px; padding: 10px 0">← je lijst</a>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label)">koptelefoon · 5 winkels</span>
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 900; font-size: 30px; line-height: 0.95; letter-spacing: -0.035em">Sony WH-1000XM6</h1>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 6px">
      <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 44px; letter-spacing: -0.035em; line-height: 1">€ 329</span>
      <span style="color: var(--text2); font-size: 14px">laagst nu, bij amazon.nl</span>
    </div>
  </div>

  <div style="padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label)"><span>laagste prijs, 90 dagen</span><span>jul → okt</span></div>
    <svg viewBox="0 0 316 150" width="316" height="150" role="img" aria-label="prijsverloop: rond 349, in augustus 319, nu 329">
      <line x1="0" x2="316" y1="116.6" y2="116.6" stroke="#262626" stroke-dasharray="4 4"></line>
      <line x1="0" x2="316" y1="38.6" y2="38.6" stroke="#262626" stroke-dasharray="4 4"></line>
      <polyline points="0,38.6 40,38.6 60,64.6 90,38.6 120,116.6 140,116.6 155,38.6 230,38.6 250,64.6 280,64.6 300,90.6 316,90.6" fill="none" stroke="#5B9DFF" stroke-width="2.5" stroke-linejoin="round"></polyline>
      <circle cx="316" cy="90.6" r="5" fill="#5B9DFF"></circle>
    </svg>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--label)">90d laag</span><span style="font-weight: 600">€ 319</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--label)">mediaan</span><span style="font-weight: 600">€ 349</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--label)">90d hoog</span><span style="font-weight: 600">€ 359</span></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--label)">per winkel</span>
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line)">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{o.shop}}</span><span style="font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--text2)">{{o.meta}}</span></span>
        <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 18px; letter-spacing: -0.03em">{{o.price}}</span>
        <a href="https://example.com" aria-label="open winkel" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"></path></svg></a>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <label for="doel" style="flex: 1">doelprijs</label>
      <input id="doel" type="text" value="€ 299" inputmode="decimal" style="width: 110px; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font: inherit; text-align: right">
    </div>
    <label style="display: flex; align-items: center; gap: 12px; cursor: pointer"><input type="checkbox" checked="{{ true }}"> <span>meld ook elke daling, niet alleen onder doelprijs</span></label>
    <label style="display: flex; align-items: center; gap: 12px; cursor: pointer"><input type="checkbox" checked="{{ true }}"> <span>black friday-oordeel sturen</span></label>
  </div>

  <a href="Deal.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; background: var(--card2); color: var(--text); text-decoration: none; font-weight: 600">prototype: spoel door naar black friday</a>
  <button type="button" style="background: none; border: 0; padding: 8px 0; color: var(--warn); font: inherit; cursor: pointer; align-self: flex-start">stop met volgen</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      offers: [
        { shop: 'amazon.nl', meta: 'op voorraad · 10:00', price: '€ 329' },
        { shop: 'bol', meta: 'op voorraad · 10:00', price: '€ 339' },
        { shop: 'coolblue', meta: 'op voorraad · 10:00', price: '€ 349' },
        { shop: 'mediamarkt', meta: 'prijs onbekend · laatst 04:00', price: '€ 349' }
      ]
    };
  }
}
</script>
</body>
</html>
