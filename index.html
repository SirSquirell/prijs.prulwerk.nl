<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prijswacht</title>
<meta name="description" content="privé prijstracker. nog in aanbouw.">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F4F1" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Instrument+Sans:wght@400&display=swap">
<style>
:root{--page:#050505;--text:#F2F2F0;--text-2:#9A9A96;--accent:#5B9DFF;--prulwerk-lime:#C9F531;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--page:#F4F4F1;--text:#12120F;--text-2:#5A5A55;--accent:#1F5FC4;--prulwerk-lime:#A6D400;color-scheme:light}}
body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font:16px/1.5 'Instrument Sans',system-ui,sans-serif;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:560px;padding:32px 16px;margin:0 auto}
h1{margin:0;font-family:Archivo,sans-serif;font-weight:900;font-size:clamp(40px,10vw,64px);line-height:.94;letter-spacing:-.035em}
p{margin:0;color:var(--text-2)}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 16px;max-width:560px;width:100%;box-sizing:border-box;margin:0 auto}
.mark{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:-.035em;font-size:20px}
.pw{font-family:Archivo,sans-serif;font-weight:900;font-size:14px;color:var(--text);text-decoration:none}
.pw span{color:var(--prulwerk-lime)}
b{color:var(--accent);font-weight:400}
</style>
</head>
<body>
<header>
  <span class="mark">prijswacht</span>
  <a class="pw" href="https://prulwerk.nl/">prulwerk<span>.nl</span></a>
</header>
<main>
  <h1>zeg wat je wilt hebben. wij letten op de prijs.</h1>
  <p>privé prijstracker voor nederlandse winkels. meldt het als de prijs zakt, en zegt rond black friday of de korting echt is.</p>
  <p><b>nog in aanbouw.</b> alleen op uitnodiging.</p>
</main>
</body>
</html>
